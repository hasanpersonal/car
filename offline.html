<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#04050c">
    <title>NEON DRIVE - Offline</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 50% 38%, #0b1230 0%, #04050c 68%);
            color: #eaf4ff;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            text-align: center;
        }
        main { max-width: 520px; }
        img {
            width: 128px;
            height: 128px;
            border-radius: 28px;
            box-shadow: 0 0 42px rgba(255, 0, 85, 0.35), 0 0 70px rgba(0, 240, 255, 0.22);
        }
        h1 {
            margin: 24px 0 8px;
            font-size: clamp(2rem, 9vw, 3.8rem);
            letter-spacing: 0.08em;
            color: #fff;
            text-shadow: 0 0 14px #00f0ff, 0 0 34px #ff0055;
        }
        h2 { margin: 0 0 14px; color: #ffea00; font-size: 1rem; letter-spacing: 0.18em; }
        p { color: #b9c8e8; line-height: 1.6; }
        a, button {
            display: inline-block;
            margin: 10px 6px 0;
            padding: 12px 22px;
            border: 2px solid #00f0ff;
            border-radius: 999px;
            background: rgba(0, 240, 255, 0.1);
            color: #fff;
            font: inherit;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-decoration: none;
            cursor: pointer;
        }
        a.primary { border-color: #ffea00; background: rgba(255, 234, 0, 0.12); }
    </style>
</head>
<body>
    <main>
        <img src="icons/icon-192.png" alt="NEON DRIVE icon">
        <h1>NEON DRIVE</h1>
        <h2>YOU ARE OFFLINE</h2>
        <p>
            Multiplayer needs an internet connection. After NEON DRIVE has
            finished its first online download, Solo Practice is available
            offline from the cached game.
        </p>
        <a class="primary" href="./">OPEN THE GAME</a>
        <button type="button" onclick="window.location.reload()">TRY AGAIN</button>
    </main>
</body>
</html>
